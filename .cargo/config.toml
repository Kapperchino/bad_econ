[alias]
gpu-10m = [
    "run", "--locked", "--release", "--example", "gpu_throughput", "--",
    "--sizes", "10000000", "--worker-cohort-size", "10", "--farmer-cohort-size", "10",
    "--seed", "40", "--workgroup", "64", "--warmup", "4", "--days", "60",
]
gpu-fast = [
    "test", "--locked", "--features", "viewer", "--lib", "--jobs", "2",
    "--", "--test-threads=1", "--exact",
    "tests::contracts::authorization_reads_create_dependencies",
    "tests::contracts::serialized_bundles_preserve_grouped_gross_debits_and_authorization",
    "tests::railway::connected_railways_charge_freight_and_foreign_track_fees_on_gpu",
    "tests::demography::exhausted_person_growth_budget_restores_the_complete_audited_day",
    "tests::execution::arithmetic_fault_rolls_back_and_reset_recovers",
    "tests::execution::authorization_flags_preserve_wide_guards_and_empty_events",
    "tests::execution::branched_graph_and_grouped_debits_match_serial_ledger",
    "tests::execution::checkpoint_rejects_tampering_and_keeps_last_audited_boundary",
    "tests::industry::steel_requires_both_inputs_and_conserves_each_good_on_gpu",
    "tests::population::actor_rows_round_trip_on_gpu_and_reject_mismatched_lengths",
]
gpu-full = [
    "test", "--locked", "--features", "viewer", "--lib", "--tests", "--jobs", "2",
    "--", "--test-threads=1",
]

[env]
RUST_TEST_THREADS = "1"
