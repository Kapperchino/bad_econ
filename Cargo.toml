[package]
name = "bad_econ"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[features]
default = ["compute"]
compute = ["dep:burn", "dep:burn-wgpu", "dep:cubecl", "dep:pollster"]
viewer = ["compute", "dep:bevy"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
burn = { version = "=0.22.1", default-features = false, features = ["std", "wgpu", "cpu", "extension"], optional = true }
burn-wgpu = { version = "=0.22.1", default-features = false, features = ["std"], optional = true }
cubecl = { version = "=0.11.1", default-features = false, features = ["std", "wgpu", "cpu"], optional = true }
pollster = { version = "1.0.1", optional = true }
bevy = { version = "=0.20.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_gizmos", "bevy_gizmos_render", "bevy_text", "bevy_ui", "bevy_ui_render", "default_font", "debug", "x11", "wayland"], optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
