[package]
name = "bad_econ"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "gpu"
path = "tests/gpu.rs"

[features]
default = ["compute"]
compute = ["dep:burn", "dep:burn-wgpu", "dep:cubecl", "dep:cubek", "dep:pollster", "dep:ash", "dep:objc2-metal", "dep:sysinfo", "dep:windows"]
viewer = ["compute", "dep:bevy"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
bitflags = "2.13.2"
enumflags2 = { version = "0.7.12", features = ["std"] }
burn = { version = "=0.22.1", default-features = false, features = ["std", "wgpu", "cpu", "extension"], optional = true }
burn-wgpu = { version = "=0.22.1", default-features = false, features = ["std"], optional = true }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
cubecl = { version = "=0.11.1", default-features = false, features = ["std", "wgpu", "cpu"], optional = true }
cubek = { version = "=0.3.1", default-features = false, features = ["std", "stdlib", "reduce", "matmul", "random"], optional = true }
pollster = { version = "1.0.1", optional = true }
bevy = { version = "=0.20.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_audio", "wav", "bevy_log", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_gizmos", "bevy_gizmos_render", "bevy_text", "bevy_ui", "bevy_ui_render", "default_font", "debug", "x11", "wayland"], optional = true }

[target.'cfg(any(windows, target_os = "linux", target_os = "android", target_os = "freebsd", target_os = "macos"))'.dependencies]
ash = { version = "=0.38.0", default-features = false, optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDevice"], optional = true }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["Win32_Graphics_Dxgi"], optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.icu_normalizer_data]
opt-level = 0

[profile.dev.package.icu_segmenter_data]
opt-level = 0
